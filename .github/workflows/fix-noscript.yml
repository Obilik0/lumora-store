name: Fix Meta Pixel HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Meta Pixel noscript into body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          block = re.compile(r'\n<noscript><img height="1" width="1" style="display:none"\n  src="https://www\.facebook\.com/tr\?id=1315231320473021&ev=PageView&noscript=1"\n/></noscript>\n', re.MULTILINE)
          m = block.search(s)
          if not m:
              raise SystemExit('Meta Pixel noscript block not found; nothing changed.')

          s = block.sub('\n', s, count=1)
          marker = '  <body>\n'
          if marker not in s:
              raise SystemExit('Body marker not found.')

          noscript = '''  <noscript><img height="1" width="1" style="display:none"\n    src="https://www.facebook.com/tr?id=1315231320473021&ev=PageView&noscript=1"\n  /></noscript>\n'''
          s = s.replace(marker, marker + noscript, 1)
          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-noscript.yml
          git commit -m "fix: move Meta Pixel noscript into body"
          git push